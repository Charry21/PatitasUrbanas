services:
  postgres_db:
    image: postgres:16
    container_name: patitas_urbanas_db
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: patitas_urbanas
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_v16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d patitas_urbanas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_app:
    build: ./app
    container_name: patitas_urbanas_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      - POSTGRES_DB=patitas_urbanas
      - DB_HOST=postgres_db
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/patitas_urbanas
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PATITAS_SEGURIDAD_JWT_CLAVE_PUBLICA=file:/run/secrets/jwt_publica.pem
    volumes:
      - ${JWT_CLAVE_PUBLICA:-./secretos/publica.pem}:/run/secrets/jwt_publica.pem:ro

volumes:
  pgdata_v16:
