version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: patitas_urbanas_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: patitas_urbanas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d patitas_urbanas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_app:
    build: ./app
    container_name: patitas_urbanas_api
    ports:
      - "3000:3000"
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
      - POSTGRES_DB=patitas_urbanas
      - DB_HOST=postgres_db

volumes:
  pgdata:
